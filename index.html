<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4EC">
<title>La Dispensa</title>
<style>
:root{
  --paper:#F2F4EC;
  --paper-2:#FBFCF7;
  --ink:#1B2A24;
  --ink-soft:#5C6B62;
  --line:#D5DACB;
  --bottiglia:#1B4D3E;
  --senape:#D89A26;
  --pomodoro:#C2402B;
  --orto:#3E7B4F;
  --prugna:#7A4B8C;
  --c-proteine:var(--pomodoro);
  --c-carbo:var(--senape);
  --c-verdura:var(--orto);
  --c-spuntini:var(--prugna);
  --gelo:#3E7A99;
  --azzurro:#2E6E8E;
  --azzurro-bg:#E4F0F6;
  --azzurro-bg2:#D2E7F1;
  --azzurro-line:#B6D3E1;
  --gelo-bg:#E7F1F6;
  --r:14px;
  --sh:0 1px 0 var(--line), 0 6px 18px -14px rgba(27,42,36,.5);
  --display:"Avenir Next","Trebuchet MS",system-ui,-apple-system,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:26px 26px;
  background-position:-1px -1px;
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--bottiglia);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- intestazione ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 0;
}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{
  font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;
}
.brand .sub{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
nav{display:flex;gap:4px;margin-top:10px}
nav button{
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:9px 12px;color:var(--ink-soft);border-bottom:2px solid transparent;
}
nav button.on{color:var(--bottiglia);border-bottom-color:var(--bottiglia);font-weight:500}
nav .badge{
  display:inline-block;min-width:17px;padding:0 4px;margin-left:5px;border-radius:9px;
  background:var(--senape);color:#2A1D00;font-size:10px;line-height:16px;text-align:center;font-weight:500;
}
main{padding:16px 0 96px}
.wrap{padding:0 16px;max-width:1100px;margin:0 auto}

/* ---------- barra settimana ---------- */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weekbar .lab{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.arrow{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--paper-2);font-size:15px;line-height:1}
.arrow:active{background:var(--line)}

/* ---------- nastro giorni ---------- */
.days{
  display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px 16px 14px;margin:0 -16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
}
.day{
  flex:0 0 84%;scroll-snap-align:center;background:var(--paper-2);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;
}
@media(min-width:760px){.day{flex-basis:300px;scroll-snap-align:start}}
.day.today{border-color:var(--bottiglia);box-shadow:0 0 0 1px var(--bottiglia),0 6px 18px -14px rgba(27,42,36,.5)}
.day > .dh{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:11px 14px;border-bottom:1px solid var(--line);background:linear-gradient(var(--paper) 0%,var(--paper-2) 100%);
}
.dh .name{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.dh .date{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.day.today .dh .date{color:var(--bottiglia);font-weight:500}
.meal{padding:9px 14px;border-bottom:1px dashed var(--line)}
.dsport{
  display:block;width:100%;text-align:left;padding:7px 14px;border-bottom:1px solid var(--azzurro-line);
  background:var(--azzurro-bg);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--azzurro);
}
.dsport:active{background:var(--azzurro-bg2)}
.meal:last-child{border-bottom:none}
.meal .mh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal .mn{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}
.add{
  width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
  font-size:15px;line-height:20px;color:var(--bottiglia);flex:0 0 auto;
}
.add:active{background:var(--bottiglia);color:var(--paper-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;max-width:100%;
  padding:4px 5px 4px 9px;border-radius:999px;font-size:12.5px;
  background:var(--paper);border:1px solid var(--line);
}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip .q{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.chip .x{width:18px;height:18px;border-radius:50%;font-size:12px;line-height:16px;color:var(--ink-soft);background:var(--line)}
.empty-slot{font-size:12.5px;color:#9AA79E;margin-top:4px;font-style:italic}

/* ---------- dispensa ---------- */
.section-h{
  display:flex;align-items:center;gap:9px;margin:20px 0 9px;
}
.section-h .tag{width:10px;height:10px;border-radius:3px}
.section-h h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.section-h .count{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-left:auto}
.grid{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}

/* riga alimento — lettura in una passata: posto · nome · quantità · comandi */
.item{
  display:flex;align-items:center;gap:10px;
  background:var(--paper-2);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:12px;padding:9px 10px 9px 9px;box-shadow:var(--sh);
}
.item .glass{flex:0 0 auto;margin-right:1px}
.item.out .glass{opacity:.45}
.item .txt{flex:1;min-width:0}
.item .nm{
  font-weight:600;font-size:15px;letter-spacing:-.01em;word-break:break-word;
  text-align:left;display:block;width:100%;
}
.item .meta{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:1px}
.item .meta .exp{color:var(--pomodoro);font-weight:500}
.qbox{flex:0 0 auto;text-align:right;line-height:1.05;padding-right:2px}
.qbox b{font-family:var(--mono);font-size:19px;font-weight:500;display:block}
.qbox span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.step{
  flex:0 0 auto;width:28px;height:28px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);font-size:15px;line-height:1;
}
.step:active{background:var(--line)}
.cart{
  flex:0 0 auto;width:28px;height:28px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);font-size:13px;line-height:26px;color:var(--ink-soft);
}
.cart.on{background:var(--bottiglia);border-color:var(--bottiglia);color:var(--paper-2)}

/* esaurito */
.item.out{border-left-color:var(--line)!important;background:var(--paper)}
.item.out .nm{color:var(--ink-soft)}
.item.out .qbox b{color:var(--pomodoro);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:6px}

/* surgelati: brina, bordo ghiaccio, fiocco */
.item.frz{
  background:
    repeating-linear-gradient(115deg, rgba(91,143,168,.09) 0 2px, transparent 2px 9px),
    var(--gelo-bg);
  border-color:#C3D8E2;border-left-color:var(--gelo)!important;
}
.item.frz .meta{color:var(--gelo)}
.item.frz .step,.item.frz .cart{background:#fff;border-color:#C3D8E2}
.item.frz.out{background:var(--paper);border-left-color:#C3D8E2!important}
.section-h .sub-count{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gelo);margin-left:8px}

/* vista griglia compatta — giorni in riga, pasti in colonna */
.gwrap{border:1.5px solid var(--ink);border-radius:4px;background:var(--paper-2);overflow:hidden}
.grow{display:grid;grid-template-columns:36px 50px repeat(3,1fr);align-items:stretch}
.grow + .grow{border-top:1px solid var(--line)}
.grow.td{background:rgba(27,77,62,.05)}
.ghead{background:var(--paper);border-bottom:1.5px solid var(--ink)}
.ghead .gc{
  height:30px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);border-left:1px solid var(--line);
}
.ghead .gc.gcorner{border-left:none}
.ghead .gc.gsporth{color:var(--azzurro);background:var(--azzurro-bg2)}
.gdl{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink);background:var(--paper);line-height:1.1;
}
.gdl .d{font-size:9px;opacity:.7;margin-top:1px}
.gdl.td{color:var(--bottiglia);font-weight:600;background:rgba(27,77,62,.1)}
.gcell{
  border-left:1px solid var(--line);height:62px;padding:5px 3px;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;overflow:hidden;
}
.gcell .gi{
  display:block;width:100%;font-size:8.5px;line-height:1.2;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;letter-spacing:-.02em;
}
.gcell .gi.frz::before{content:"❄ ";color:var(--gelo)}
.gcell .more{font-family:var(--mono);font-size:8px;color:var(--ink-soft)}
.gcell .plus{font-size:13px;color:#C3C9BC;line-height:1}

/* colonna attività fisica */
.gcell.gsp{
  justify-content:center;gap:1px;background:var(--azzurro-bg);border-left-color:var(--azzurro-line);
}
.gcell.gsp .ic{font-size:14px;line-height:1}
.gcell.gsp .lbl{
  font-family:var(--mono);font-size:7.5px;letter-spacing:.02em;text-transform:uppercase;
  color:var(--azzurro);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.gcell.gsp.has{background:var(--azzurro-bg2)}
.gcell.gsp.has .lbl{font-weight:600}
.gcell.gsp.rest .lbl{color:#9FB3BE}
.gcell.gsp .plus{color:#A9C4D2}
.glegend{
  display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);align-items:center;
}
.glegend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
.star{vertical-align:-2px}
.meal.free{background:rgba(232,163,23,.07)}
.gcell{position:relative}
.gstar{position:absolute;top:2px;right:3px;line-height:0}
.gcell.free{background:rgba(232,163,23,.1)}
.grow.td .gcell.free{background:rgba(232,163,23,.16)}
.starpick{display:flex;gap:6px;margin-bottom:12px}
.starpick button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:9px 6px;
  border:1px solid var(--line);border-radius:11px;background:var(--paper-2);
  font-size:12px;font-weight:500;line-height:1.1;text-align:center;
}
.starpick button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sport-pick{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.sport-pick button{
  display:flex;align-items:center;gap:6px;padding:9px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--paper-2);font-size:13.5px;font-weight:500;
}
.sport-pick button.on{background:var(--azzurro);border-color:var(--azzurro);color:#fff}

/* selettore categoria (variabile dominante) */
.seg{
  display:flex;gap:3px;padding:3px;margin-bottom:6px;
  background:var(--paper-2);border:1px solid var(--line);border-radius:13px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1 0 auto;min-width:0;padding:8px 11px 7px;border-radius:10px;text-align:center;
  color:var(--ink-soft);line-height:1.15;white-space:nowrap;
}
.seg button .t{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.seg button .n{display:block;font-family:var(--mono);font-size:10px;margin-top:1px;opacity:.75}
.seg button.on{color:#fff}

/* sotto-testata reparto dentro la categoria */
.loc-h{
  display:flex;align-items:center;gap:7px;margin:11px 0 5px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
}
.loc-h::after{content:"";flex:1;height:1px;background:var(--line)}
.loc-h .n{font-size:10px;opacity:.8}
.loc-h.frz{color:var(--gelo)}
.loc-h.frz::after{background:#C3D8E2}

/* ---------- spesa ---------- */
.list-row{
  display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--paper-2);
  border:1px solid var(--line);border-radius:12px;margin-bottom:7px;box-shadow:var(--sh);
}
.tick{
  width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:1.5px solid var(--line);
  background:var(--paper);font-size:13px;line-height:19px;color:transparent;
}
.tick.on{background:var(--bottiglia);border-color:var(--bottiglia);color:var(--paper-2)}
.list-row.done .nm{text-decoration:line-through;color:var(--ink-soft)}
.list-row .nm{flex:1;font-weight:500;word-break:break-word}
.list-row .q{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.del{width:26px;height:26px;border-radius:8px;color:var(--ink-soft);font-size:15px;line-height:1}

/* ---------- controlli generici ---------- */
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.field{
  flex:1;min-width:130px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--paper-2);font-size:15px;
}
.btn{
  padding:10px 15px;border-radius:11px;background:var(--bottiglia);color:var(--paper-2);
  font-weight:600;font-size:14px;letter-spacing:-.01em;
}
.btn:active{opacity:.85}
.btn.ghost{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.warn{background:var(--senape);color:#2A1D00}
.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--ink-soft);
  background:var(--paper-2);
}
.empty strong{display:block;font-family:var(--display);font-size:17px;color:var(--ink);margin-bottom:4px;font-weight:600}

/* ---------- pannello ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,42,36,.42);z-index:50;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--paper);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  max-height:86vh;display:none;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.on{display:flex}
@media(min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:520px;border-radius:18px;border:1px solid var(--line);max-height:80vh}
}
.sheet .sh{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet .sh h3{font-family:var(--display);font-size:18px;margin:0;font-weight:600;flex:1;letter-spacing:-.01em}
.sheet .sb{padding:14px 16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pick{
  display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);
}
.pick:last-child{border-bottom:none}
.pick .nm{flex:1;font-weight:500}
.pick .av{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.pick .qty{width:46px;text-align:center;padding:6px 2px;border:1px solid var(--line);border-radius:9px;background:var(--paper-2);font-family:var(--mono);font-size:13px}
.pick button.go{padding:7px 11px;border-radius:9px;background:var(--bottiglia);color:var(--paper-2);font-size:13px;font-weight:600}
.pick.zero .nm{color:var(--ink-soft)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.filters button{
  padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper-2);
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);
}
.filters button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.35}
label.lb{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 5px}
.two{display:flex;gap:8px}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:70;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{
  position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
  height:50px;padding:0 20px;border-radius:25px;background:var(--bottiglia);color:var(--paper-2);
  font-weight:600;font-size:15px;box-shadow:0 8px 22px -10px rgba(27,42,36,.8);display:none;
}
.fab.on{display:block}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>La Dispensa</h1>
    <span class="sub">pasti · frigo · spesa</span>
  </div>
  <nav>
    <button data-tab="pasti" class="on">Settimana</button>
    <button data-tab="dispensa">Dispensa</button>
    <button data-tab="spesa">Spesa <span class="badge" id="badgeSpesa" style="display:none">0</span></button>
  </nav>
</header>

<main>
  <!-- SETTIMANA -->
  <section id="tab-pasti">
    <div class="wrap weekbar">
      <button class="arrow" id="wPrev" aria-label="Settimana precedente">‹</button>
      <span class="lab" id="wLabel"></span>
      <button class="arrow" id="wNext" aria-label="Settimana successiva">›</button>
    </div>
    <div class="wrap"><div class="seg" id="vSeg" style="margin-bottom:12px">
      <button data-v="schede"><span class="t">Schede</span></button>
      <button data-v="griglia"><span class="t">Griglia</span></button>
    </div></div>
    <div class="days" id="days"></div>
    <div class="wrap" id="gridWrap" style="display:none"></div>
    <div class="wrap" id="dayActions" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="toToday">Vai a oggi</button>
      <button class="btn ghost" id="clearWeek">Svuota la settimana</button>
    </div>
  </section>

  <!-- DISPENSA -->
  <section id="tab-dispensa" style="display:none">
    <div class="wrap">
      <div class="bar">
        <input class="field" id="pSearch" placeholder="Cerca nella dispensa">
        <button class="btn" id="openNewItem">+ Alimento</button>
      </div>
      <div class="seg" id="pSeg"></div>
      <div id="pantryBody"></div>
    </div>
  </section>

  <!-- SPESA -->
  <section id="tab-spesa" style="display:none">
    <div class="wrap">
      <div class="bar">
        <input class="field" id="sName" placeholder="Cosa serve? es. yogurt greco">
        <input class="field" id="sQty" style="flex:0 0 74px;min-width:0;text-align:center" placeholder="qtà" inputmode="decimal">
        <button class="btn" id="sAdd">Aggiungi</button>
      </div>
      <div id="listBody"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px" id="listActions"></div>
    </div>
  </section>
</main>

<button class="fab" id="fab">+ Alimento</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sh"><h3 id="sheetTitle"></h3><button class="del" id="sheetClose" aria-label="Chiudi">✕</button></div>
  <div class="sb" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ costanti ============ */
const CATS = [
  {k:'proteine', label:'Proteine',          v:'var(--c-proteine)'},
  {k:'carbo',    label:'Carbo',             v:'var(--c-carbo)'},
  {k:'verdura',  label:'Verdure & frutta',  v:'var(--c-verdura)'},
  {k:'spuntini', label:'Spuntini',          v:'var(--c-spuntini)'}
];
const catOf = k => CATS.find(c=>c.k===k) || {k:'spuntini',label:'Spuntini',v:'var(--c-spuntini)'};
const MEALS = ['Colazione','Merenda','Pranzo','Merenda 1','Merenda 2','Cena'];
const DAYS  = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const LOCS  = ['Frigo','Freezer','Dispensa'];
const KEY   = 'la-dispensa:v1';

/* ============ archivio ============ */
const store = {
  async get(k){
    if (window.storage) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch(e){} }
    try { return localStorage.getItem(k); } catch(e){ return null; }
  },
  async set(k,v){
    if (window.storage) { try { await window.storage.set(k,v); return; } catch(e){} }
    try { localStorage.setItem(k,v); } catch(e){}
  }
};
let state = { pantry:[], weeks:{}, list:[] };
let saveT = null;
function save(){ state.view = view; clearTimeout(saveT); saveT = setTimeout(()=>store.set(KEY, JSON.stringify(state)), 250); }

/* ============ utilità ============ */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Math.round((Number(n)||0)*100)/100;
const fmt = n => String(num(n)).replace('.',',');
function mondayOf(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-w); return x; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysTo(dateStr){
  if(!dateStr) return null;
  const a=new Date(dateStr+'T00:00:00'), b=new Date(); b.setHours(0,0,0,0);
  return Math.round((a-b)/86400000);
}
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1900);
}

/* ============ stato vista ============ */
let tab = 'pasti';
let weekStart = mondayOf(new Date());
let view = 'schede';
let pCat = 'tutte';
let pQuery = '';

function week(){
  const k = iso(weekStart);
  if(!state.weeks[k]){
    state.weeks[k] = {};
    for(let i=0;i<7;i++){ state.weeks[k][i] = {}; MEALS.forEach(m=>state.weeks[k][i][m]=[]); }
  }
  const w = state.weeks[k];
  for(let i=0;i<7;i++){ w[i] = w[i]||{}; MEALS.forEach(m=>{ w[i][m] = w[i][m]||[]; }); }
  return w;
}

/* ============ logica dispensa ============ */
let starN = 0;
function starSvg(kind, size){                     // stella intera o a metà
  if(!kind) return '';
  const id = 'st'+(++starN), gold = '#E8A317';
  const d = 'M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5L12 17.5l-5.8 3.05 1.1-6.5-4.7-4.6 6.5-.95z';
  const fill = kind==='half'
    ? `<defs><linearGradient id="${id}"><stop offset="50%" stop-color="${gold}"/><stop offset="50%" stop-color="${gold}" stop-opacity="0"/></linearGradient></defs><path d="${d}" fill="url(#${id})"/>`
    : `<path d="${d}" fill="${gold}"/>`;
  return `<svg class="star" width="${size}" height="${size}" viewBox="0 0 24 24" role="img" aria-label="${kind==='half'?'Mezzo pasto libero':'Pasto libero'}">
    ${fill}<path d="${d}" fill="none" stroke="${gold}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function getStar(d,m){ const s = week()[d].stars; return (s && s[m]) || ''; }
function setStar(d,m,v){ const w = week(); w[d].stars = w[d].stars || {}; if(v) w[d].stars[m]=v; else delete w[d].stars[m]; }

function pantryById(id){ return state.pantry.find(p=>p.id===id); }
const isPorz = p => (p.unit||'porz').trim().toLowerCase().startsWith('porz');
function stepOf(p){                       // quanto tolgono/aggiungono − e +
  if(isPorz(p)) return 1;                 // una porzione intera
  return num(p.std) > 0 ? num(p.std) : 1; // la porzione standard nell'unità dell'alimento
}
function stdLabel(p){                      // "1 porz = 150 g"
  if(!num(p.std)) return '';
  return isPorz(p) ? `porz da ${fmt(p.std)} ${esc(p.stdU||'g')}` : '';
}
function totLabel(p){                      // "= 450 g"
  if(!isPorz(p) || !num(p.std) || !(p.qty>0)) return '';
  return `${fmt(num(p.qty)*num(p.std))} ${esc(p.stdU||'g')}`;
}
let glassN = 0;
function glass(p, color){                  // bicchiere che si svuota
  const full = Math.max(num(p.full)||0, num(p.qty)||0, 1);
  const r = Math.max(0, Math.min(1, num(p.qty)/full));
  const top = 3, bot = 27, h = bot - top;
  const y = top + h*(1-r);
  const id = 'gl'+(++glassN);
  return `<svg class="glass" width="21" height="30" viewBox="0 0 21 30" role="img" aria-label="Rimane circa il ${Math.round(r*100)}%">
    <defs><clipPath id="${id}"><path d="M4 3 H17 L14.6 27 H6.4 Z"/></clipPath></defs>
    <path d="M4 3 H17 L14.6 27 H6.4 Z" fill="#fff"/>
    <rect x="0" y="${y.toFixed(1)}" width="21" height="${(bot-y+1).toFixed(1)}" fill="${color}" opacity=".38" clip-path="url(#${id})"/>
    <rect x="0" y="${y.toFixed(1)}" width="21" height="1.6" fill="${color}" opacity=".9" clip-path="url(#${id})"/>
    <path d="M4 3 H17 L14.6 27 H6.4 Z" fill="none" stroke="${color}" stroke-width="1.1" opacity=".65" stroke-linejoin="round"/>
  </svg>`;
}
function consume(pid, q){ const p=pantryById(pid); if(!p) return; p.qty = Math.max(0, num(p.qty - q)); }
function restore(pid, q){ const p=pantryById(pid); if(!p) return; p.qty = num(p.qty + q); p.full = Math.max(num(p.full)||0, p.qty); }

/* ============ render: settimana ============ */
function renderWeek(){
  const label = document.getElementById('wLabel');
  const end = addDays(weekStart,6);
  const opt = {day:'numeric', month:'short'};
  label.textContent = weekStart.toLocaleDateString('it-IT',opt) + ' — ' + end.toLocaleDateString('it-IT',opt);
  const w = week();
  const todayIso = iso(new Date());
  const box = document.getElementById('days');
  box.innerHTML = DAYS.map((dn,i)=>{
    const date = addDays(weekStart,i);
    const isToday = iso(date)===todayIso;
    const meals = MEALS.map(m=>{
      const entries = w[i][m]||[];
      const chips = entries.length ? '<div class="chips">'+entries.map(e=>{
        const c = catOf(e.cat);
        return `<span class="chip"><i class="dot" style="background:${c.v}"></i>${esc(e.name)}<span class="q">${fmt(e.qty)}${e.unit?' '+esc(e.unit):''}</span><button class="x" data-act="rm-entry" data-d="${i}" data-m="${esc(m)}" data-id="${e.id}" aria-label="Togli ${esc(e.name)}">✕</button></span>`;
      }).join('')+'</div>' : '<div class="empty-slot">niente ancora</div>';
      const st = getStar(i,m);
      return `<div class="meal${st?' free':''}">
        <div class="mh"><span class="mn">${m}${st?' '+starSvg(st,13):''}</span>
        <button class="add" data-act="add-food" data-d="${i}" data-m="${esc(m)}" aria-label="Aggiungi a ${m}">+</button></div>
        ${chips}
      </div>`;
    }).join('');
    return `<article class="day${isToday?' today':''}">
      <div class="dh"><span class="name">${dn}</span><span class="date">${date.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})}${isToday?' · oggi':''}</span></div>
      <button class="dsport" data-act="sport" data-d="${i}">${(()=>{const s=SPORTS.find(x=>x.k===(w[i].sport||''));return s?`${s.ic} ${s.label}`:'+ attività fisica';})()}</button>
      ${meals}
    </article>`;
  }).join('');
}

const SPORTS = [
  {k:'pesi',      ic:'🏋️', short:'PESI',    label:'Pesi'},
  {k:'corsa',     ic:'🏃‍♀️', short:'CORSA',   label:'Corsa'},
  {k:'acquagym',  ic:'🤽‍♀️', short:'ACQUAG.', label:'Acquagym'},
  {k:'hydrobike', ic:'🚴‍♀️', short:'HYDRO',   label:'Hydrobike'},
  {k:'nuoto',     ic:'🏊‍♀️', short:'NUOTO',   label:'Nuoto libero'},
  {k:'camminata', ic:'🚶‍♀️', short:'CAMMIN.', label:'Camminata'},
  {k:'riposo',    ic:'·',   short:'RIPOSO',  label:'Riposo'}
];
function sheetSport(d){
  const cur = week()[d].sport || '';
  openSheet(`${DAYS[d]} · attività`, `
    <div class="sport-pick">
      ${SPORTS.map(s=>`<button data-act="set-sport" data-d="${d}" data-s="${s.k}" class="${cur===s.k?'on':''}">${s.ic} ${s.label}</button>`).join('')}
    </div>
    ${cur?`<button class="btn ghost" data-act="set-sport" data-d="${d}" data-s="" style="margin-top:14px;width:100%">Togli l’attività</button>`:''}
  `);
}
const MEAL_SHORT = {'Colazione':'COLAZ','Merenda':'MER','Pranzo':'PRANZO','Merenda 1':'MER 1','Merenda 2':'MER 2','Cena':'CENA'};
const MEALS_GRID = ['Colazione','Pranzo','Cena'];
const DAY_SHORT = ['LUN','MAR','MER','GIO','VEN','SAB','DOM'];

function renderGrid(){
  const w = week();
  const todayIso = iso(new Date());

  // testata: giorno · sport · pasti
  let html = '<div class="gwrap"><div class="grow ghead"><div class="gc gcorner"></div><div class="gc gsporth">SPORT</div>';
  MEALS_GRID.forEach(m=>{ html += `<div class="gc">${MEAL_SHORT[m]}</div>`; });
  html += '</div>';

  for(let i=0;i<7;i++){
    const date = addDays(weekStart,i);
    const td = iso(date)===todayIso ? ' td' : '';
    html += `<div class="grow${td}">`;
    html += `<div class="gdl${td}">${DAY_SHORT[i]}<span class="d">${date.getDate()}</span></div>`;

    // colonna sport
    const sp = SPORTS.find(x=>x.k===(w[i].sport||''));
    const scls = sp ? (sp.k==='riposo' ? ' rest' : ' has') : '';
    html += `<button class="gcell gsp${td}${scls}" data-act="sport" data-d="${i}" aria-label="Attività di ${DAYS[i]}">${
      sp ? `<span class="ic">${sp.ic}</span><span class="lbl">${sp.short}</span>` : '<span class="plus">+</span>'
    }</button>`;

    // colonne pasti
    MEALS_GRID.forEach(m=>{
      const entries = w[i][m]||[];
      let inner;
      if(!entries.length){ inner = '<span class="plus">+</span>'; }
      else {
        inner = entries.slice(0,3).map(e=>{
          const p = e.pantryId ? pantryById(e.pantryId) : null;
          const frz = p && p.loc==='Freezer' ? ' frz' : '';
          return `<span class="gi${frz}" style="color:${catOf(e.cat).v}" title="${esc(e.name)}">${esc(e.name)}</span>`;
        }).join('');
        if(entries.length>3) inner += `<span class="more">+${entries.length-3}</span>`;
      }
      const st = getStar(i,m);
      html += `<button class="gcell${td}${st?' free':''}" data-act="add-food" data-d="${i}" data-m="${esc(m)}" aria-label="${m} di ${DAYS[i]}">${st?`<span class="gstar">${starSvg(st,12)}</span>`:''}${inner}</button>`;
    });
    html += '</div>';
  }

  html += '</div><div class="glegend">' +
    CATS.map(c=>`<span><i style="background:${c.v}"></i>${c.label}</span>`).join('') +
    '<span style="color:var(--gelo)">❄ dal freezer</span></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
    '<button class="btn ghost" id="clearWeek2">Svuota la settimana</button></div>';
  document.getElementById('gridWrap').innerHTML = html;
  const cw = document.getElementById('clearWeek2');
  if(cw) cw.onclick = clearWeek;
}

function renderView(){
  const grid = view==='griglia';
  document.getElementById('days').style.display = grid ? 'none' : '';
  document.getElementById('gridWrap').style.display = grid ? '' : 'none';
  document.getElementById('dayActions').style.display = grid ? 'none' : '';
  document.querySelectorAll('#vSeg button').forEach(b=>{
    const on = b.dataset.v===view;
    b.classList.toggle('on', on);
    b.style.background = on ? 'var(--ink)' : '';
  });
  if(grid) renderGrid(); else { renderWeek(); scrollToToday(false); }
}

function scrollToToday(smooth){
  const t = document.querySelector('.day.today');
  if(t) t.scrollIntoView({behavior: smooth?'smooth':'auto', inline:'center', block:'nearest'});
}

/* ============ render: dispensa ============ */
const LOC_ICON = {'Frigo':'🧊','Freezer':'❄️','Dispensa':'🫙'};
const LOC_LABEL = {'Frigo':'In frigo','Freezer':'Nel freezer','Dispensa':'In credenza'};
function renderFilters(){
  const segs = [{k:'tutte', t:'Tutte', v:'var(--ink)', n:state.pantry.length}]
    .concat(CATS.map(c=>({k:c.k, t:c.label, v:c.v, n:state.pantry.filter(p=>p.cat===c.k).length})));
  document.getElementById('pSeg').innerHTML = segs.map(s=>
    `<button data-f="${s.k}" class="${pCat===s.k?'on':''}" style="${pCat===s.k?'background:'+s.v:''}">
      <span class="t">${s.t}</span><span class="n">${s.n}</span></button>`).join('');
}
function itemRow(p){
  const c = catOf(p.cat);
  const frz = p.loc==='Freezer';
  const d = daysTo(p.exp);
  const expTxt = p.exp ? (d<0 ? '⚠ scaduto' : d===0 ? '⚠ scade oggi' : d===1 ? '⚠ scade domani' : 'scade tra '+d+' gg') : '';
  const expCls = (d!==null && d<=2) ? 'exp' : '';
  const qty = p.qty>0
    ? `<b style="color:${frz?'var(--gelo)':c.v}">${fmt(p.qty)}</b><span>${esc(p.unit||'porz')}</span>`
    : `<b>esaurito</b>`;
  const sub = [stdLabel(p), totLabel(p)&&('= '+totLabel(p)), expTxt].filter(Boolean);
  const metaHtml = sub.length
    ? `<div class="meta">${sub.map(t=>t===expTxt?`<span class="${expCls}">${t}</span>`:t).join(' · ')}</div>` : '';
  return `<div class="item${p.qty>0?'':' out'}${frz?' frz':''}" style="border-left-color:${c.v}">
    ${isPorz(p)?glass(p, frz?'#3E7A99':c.v):''}
    <div class="txt">
      <button class="nm" data-act="edit-item" data-id="${p.id}">${esc(p.name)}</button>
      ${metaHtml}
    </div>
    <div class="qbox">${qty}</div>
    <button class="step" data-act="dec" data-id="${p.id}" aria-label="Togli una porzione di ${esc(p.name)}">−</button>
    <button class="step" data-act="inc" data-id="${p.id}" aria-label="Aggiungi una porzione di ${esc(p.name)}">+</button>
    <button class="cart${p.inList?' on':''}" data-act="toList" data-id="${p.id}" aria-label="${p.inList?'Togli dalla spesa':'Metti in spesa'}" title="${p.inList?'Togli dalla spesa':'Metti in spesa'}">🛒</button>
  </div>`;
}
function renderPantry(){
  renderFilters();
  const body = document.getElementById('pantryBody');
  const q = pQuery.trim().toLowerCase();
  const cats = pCat==='tutte' ? CATS : CATS.filter(c=>c.k===pCat);
  const order = (a,b) => (a.qty>0?0:1)-(b.qty>0?0:1) || a.name.localeCompare(b.name);
  let html = '', shown = 0;

  cats.forEach(c=>{
    const items = state.pantry.filter(p=>p.cat===c.k && (!q || p.name.toLowerCase().includes(q)));
    if(!items.length) return;
    shown += items.length;
    html += `<div class="section-h"><i class="tag" style="background:${c.v}"></i><h2>${c.label}</h2>
      <span class="count">${items.length}</span></div>`;
    LOCS.forEach(l=>{
      const sub = items.filter(p=>(p.loc||'Frigo')===l).sort(order);
      if(!sub.length) return;
      html += `<div class="loc-h${l==='Freezer'?' frz':''}">${LOC_ICON[l]} ${LOC_LABEL[l]} <span class="n">${sub.length}</span></div>
        <div class="grid">${sub.map(itemRow).join('')}</div>`;
    });
  });

  if(!shown){
    if(q)                 html = `<div class="empty"><strong>Nessun risultato</strong>Prova con un altro nome${pCat!=='tutte'?' o guarda in un’altra categoria':''}.</div>`;
    else if(pCat!=='tutte')html = `<div class="empty"><strong>Niente in questa categoria</strong>Tocca “+ Alimento” per aggiungerlo.</div>`;
    else                  html = `<div class="empty"><strong>La dispensa è vuota</strong>Aggiungi cosa hai in frigo, in freezer e in credenza: da qui i pasti della settimana attingono in automatico.</div>`;
  }
  body.innerHTML = html;
}

/* ============ render: spesa ============ */
function renderList(){
  const body = document.getElementById('listBody');
  const acts = document.getElementById('listActions');
  const badge = document.getElementById('badgeSpesa');
  const open = state.list.filter(i=>!i.done).length;
  badge.textContent = open; badge.style.display = state.list.length ? 'inline-block' : 'none';

  if(!state.list.length){
    body.innerHTML = `<div class="empty"><strong>Lista vuota</strong>Scrivi qui sopra cosa ti serve, oppure tocca “in spesa” su un alimento della dispensa.</div>`;
    acts.innerHTML=''; return;
  }
  let html='';
  CATS.concat([{k:'altro',label:'Altro',v:'var(--ink-soft)'}]).forEach(c=>{
    const items = state.list.filter(i=>(i.cat||'altro')===c.k);
    if(!items.length) return;
    html += `<div class="section-h"><i class="tag" style="background:${c.v}"></i><h2>${c.label}</h2><span class="count">${items.length}</span></div>`;
    html += items.map(i=>`<div class="list-row${i.done?' done':''}">
      <button class="tick${i.done?' on':''}" data-act="tick" data-id="${i.id}" aria-label="Segna ${esc(i.name)}">✓</button>
      <span class="nm">${esc(i.name)}</span>
      <span class="q">${fmt(i.qty)}${i.unit?' '+esc(i.unit):''}</span>
      <button class="del" data-act="rm-list" data-id="${i.id}" aria-label="Elimina ${esc(i.name)}">✕</button>
    </div>`).join('');
  });
  body.innerHTML = html;
  const done = state.list.filter(i=>i.done).length;
  acts.innerHTML = `${done?`<button class="btn" data-act="stock">Riponi in dispensa (${done})</button>`:''}
    ${done?`<button class="btn ghost" data-act="clear-done">Togli i spuntati</button>`:''}`;
}

/* ============ pannello ============ */
function openSheet(title, html){
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}

/* --- pannello: scegli cibo per un pasto --- */
let pickCtx = null;
function sheetPick(d,m){
  pickCtx = {d,m};
  const rows = state.pantry.slice().sort((a,b)=>(b.qty>0)-(a.qty>0) || a.name.localeCompare(b.name));
  const list = rows.length ? rows.map(p=>{
    const c=catOf(p.cat);
    return `<div class="pick${p.qty>0?'':' zero'}" data-pk="${p.id}" data-name="${esc(p.name).toLowerCase()}">
      <i class="pip" style="background:${c.v}"></i>
      <span class="nm">${esc(p.name)}${p.loc==='Freezer'?' <span style="color:var(--gelo);font-size:12px">❄️</span>':''}</span>
      <span class="av">${p.qty>0?fmt(p.qty)+(p.unit?' '+esc(p.unit):''):'esaurito'}${(isPorz(p)&&num(p.std))?` <em style="font-style:normal;opacity:.7">(${fmt(p.std)} ${esc(p.stdU||'g')}/porz)</em>`:''}</span>
      <input class="qty" type="number" step="${isPorz(p)?'0.5':(num(p.std)||1)}" min="0" value="${fmt(stepOf(p))}" inputmode="decimal" aria-label="Quantità">
      <button class="go" data-act="pick" data-id="${p.id}">Metti</button>
    </div>`;
  }).join('') : `<div class="empty" style="margin-top:12px"><strong>Dispensa vuota</strong>Aggiungi prima qualcosa in dispensa, oppure scrivi una voce libera qui sopra.</div>`;
  const cur = week()[d][m]||[];
  const curHtml = cur.length ? `<label class="lb">Già in questo pasto</label><div class="chips" style="margin-bottom:4px">${
    cur.map(e=>`<span class="chip"><i class="dot" style="background:${catOf(e.cat).v}"></i>${esc(e.name)}<span class="q">${fmt(e.qty)}${e.unit?' '+esc(e.unit):''}</span><button class="x" data-act="rm-entry" data-d="${d}" data-m="${esc(m)}" data-id="${e.id}" aria-label="Togli ${esc(e.name)}">✕</button></span>`).join('')
  }</div>` : '';
  const st = getStar(d,m);
  const starRow = `<div class="starpick">
      <button data-act="set-star" data-d="${d}" data-m="${esc(m)}" data-s="" class="${!st?'on':''}">Normale</button>
      <button data-act="set-star" data-d="${d}" data-m="${esc(m)}" data-s="half" class="${st==='half'?'on':''}">${starSvg('half',15)} Mezzo libero</button>
      <button data-act="set-star" data-d="${d}" data-m="${esc(m)}" data-s="full" class="${st==='full'?'on':''}">${starSvg('full',15)} Pasto libero</button>
    </div>`;
  openSheet(`${DAYS[d]} · ${m}`, `
    ${starRow}
    ${curHtml}
    <div class="two">
      <input class="field" id="freeName" placeholder="Voce libera (non scala nulla)">
      <button class="btn" data-act="free">Metti</button>
    </div>
    <label class="lb">Dalla dispensa</label>
    <input class="field" id="pickSearch" placeholder="Cerca" style="width:100%;margin-bottom:6px">
    <div id="pickList">${list}</div>
  `);
  const s = document.getElementById('pickSearch');
  s.addEventListener('input', ()=>{
    const q = s.value.trim().toLowerCase();
    document.querySelectorAll('#pickList .pick').forEach(el=>{
      el.style.display = !q || el.dataset.name.includes(q) ? '' : 'none';
    });
  });
}

/* --- pannello: nuovo / modifica alimento --- */
function sheetItem(id){
  const p = id ? pantryById(id) : null;
  openSheet(p?'Modifica alimento':'Nuovo alimento', `
    <label class="lb">Nome</label>
    <input class="field" id="iName" style="width:100%" value="${p?esc(p.name):''}" placeholder="es. petto di pollo">
    <label class="lb">Categoria</label>
    <div class="filters" id="iCat">${CATS.map(c=>`<button data-c="${c.k}" class="${(p?p.cat:'proteine')===c.k?'on':''}">${c.label}</button>`).join('')}</div>
    <label class="lb">Dove sta</label>
    <div class="filters" id="iLoc">${LOCS.map(l=>`<button data-l="${l}" class="${(p?p.loc:'Frigo')===l?'on':''}">${LOC_ICON[l]} ${l}</button>`).join('')}</div>
    <div class="two">
      <div style="flex:1"><label class="lb">Quantità</label><input class="field" id="iQty" type="number" step="0.5" min="0" inputmode="decimal" value="${p?p.qty:1}"></div>
      <div style="flex:1"><label class="lb">Unità</label><input class="field" id="iUnit" value="${p?esc(p.unit||''):'porz'}" placeholder="porz, g, pz"></div>
    </div>
    <label class="lb">Porzione standard</label>
    <div class="two">
      <input class="field" id="iStd" type="number" step="1" min="0" inputmode="decimal" value="${p&&p.std?p.std:''}" placeholder="es. 150">
      <input class="field" id="iStdU" value="${p?esc(p.stdU||'g'):'g'}" placeholder="g" style="flex:0 0 78px;text-align:center">
    </div>
    <div class="hint" id="stdHint"></div>
    <label class="lb">Scadenza (facoltativa)</label>
    <input class="field" id="iExp" type="date" style="width:100%" value="${p&&p.exp?p.exp:''}">
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn" data-act="save-item" data-id="${p?p.id:''}" style="flex:1">Salva</button>
      ${p?`<button class="btn ghost" data-act="del-item" data-id="${p.id}">Elimina</button>`:''}
    </div>
  `);
  document.getElementById('iCat').addEventListener('click', e=>{
    const b=e.target.closest('button[data-c]'); if(!b) return;
    document.querySelectorAll('#iCat button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  });
  document.getElementById('iLoc').addEventListener('click', e=>{
    const b=e.target.closest('button[data-l]'); if(!b) return;
    document.querySelectorAll('#iLoc button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  });
  const hint = document.getElementById('stdHint');
  const upd = ()=>{
    const u = document.getElementById('iUnit').value.trim().toLowerCase();
    const st = num(document.getElementById('iStd').value);
    const su = document.getElementById('iStdU').value.trim() || 'g';
    hint.textContent = u.startsWith('porz')
      ? (st ? `1 porzione = ${fmt(st)} ${su} · il tasto − toglie una porzione intera`
            : 'Quanto pesa una porzione: serve per scalare la quantità giusta')
      : (st ? `Il tasto − toglierà ${fmt(st)} ${u||su} alla volta` : 'Se lo lasci vuoto, − e + spostano di 1');
  };
  ['iUnit','iStd','iStdU'].forEach(k=>document.getElementById(k).addEventListener('input',upd));
  upd();
  setTimeout(()=>document.getElementById('iName').focus(),80);
}

/* ============ azioni ============ */
function addToMeal(d,m,entry){
  week()[d][m].push(entry);
  save(); renderView(); renderPantry();
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;

  if(act==='add-food'){ sheetPick(Number(b.dataset.d), b.dataset.m); }

  else if(act==='sport'){ sheetSport(Number(b.dataset.d)); }

  else if(act==='set-star'){
    const d = Number(b.dataset.d), m = b.dataset.m;
    setStar(d, m, b.dataset.s);
    save(); renderView(); sheetPick(d,m);
  }

  else if(act==='set-sport'){
    week()[Number(b.dataset.d)].sport = b.dataset.s;
    save(); renderView(); closeSheet();
  }

  else if(act==='rm-entry'){
    const d=Number(b.dataset.d), m=b.dataset.m, w=week();
    const idx = w[d][m].findIndex(x=>x.id===id);
    if(idx>-1){ const e0=w[d][m][idx]; if(e0.pantryId) restore(e0.pantryId, e0.qty); w[d][m].splice(idx,1); save(); renderView(); renderPantry(); if(document.getElementById('sheet').classList.contains('on')) sheetPick(d,m); }
  }

  else if(act==='pick'){
    const p = pantryById(id); if(!p) return;
    const qEl = b.parentElement.querySelector('.qty');
    let q = num(qEl.value); if(!(q>0)) q = 1;
    if(q > p.qty){
      if(!confirm(`In dispensa ci sono ${fmt(p.qty)} ${p.unit||''} di ${p.name}. Lo metto lo stesso? La quantità andrà a zero.`)) return;
    }
    consume(p.id, q);
    addToMeal(pickCtx.d, pickCtx.m, {id:uid(), name:p.name, qty:q, unit:p.unit||'', cat:p.cat, pantryId:p.id});
    if(pantryById(p.id).qty===0 && !p.inList){ p.inList=true; state.list.push({id:uid(), name:p.name, qty:1, unit:p.unit||'', cat:p.cat, pantryId:p.id, done:false}); renderList(); toast(`${p.name} finito → aggiunto alla spesa`); }
    else toast(`${p.name} · ${fmt(q)} ${p.unit||''} → ${pickCtx.m}`);
    closeSheet();
  }

  else if(act==='free'){
    const el = document.getElementById('freeName');
    const n = el.value.trim(); if(!n){ el.focus(); return; }
    addToMeal(pickCtx.d, pickCtx.m, {id:uid(), name:n, qty:1, unit:'', cat:'spuntini', pantryId:null});
    closeSheet();
  }

  else if(act==='edit-item'){ sheetItem(id); }

  else if(act==='save-item'){
    const name = document.getElementById('iName').value.trim();
    if(!name){ document.getElementById('iName').focus(); return; }
    const cat = document.querySelector('#iCat button.on').dataset.c;
    const loc = document.querySelector('#iLoc button.on').dataset.l;
    const qty = num(document.getElementById('iQty').value);
    const unit = document.getElementById('iUnit').value.trim();
    const exp = document.getElementById('iExp').value;
    const std = num(document.getElementById('iStd').value) || 0;
    const stdU = document.getElementById('iStdU').value.trim() || 'g';
    if(id){ const it = pantryById(id); Object.assign(it, {name,cat,loc,qty,unit,exp,std,stdU}); it.full = Math.max(it.full||0, qty); }
    else { state.pantry.push({id:uid(), name, cat, loc, qty, unit, exp, std, stdU, full:qty, inList:false}); }
    save(); renderPantry(); renderView(); closeSheet(); toast(id?'Alimento aggiornato':'Aggiunto in dispensa');
  }

  else if(act==='del-item'){
    const p = pantryById(id); if(!p) return;
    if(!confirm(`Elimino ${p.name} dalla dispensa? Resta nei pasti già pianificati.`)) return;
    state.pantry = state.pantry.filter(x=>x.id!==id);
    save(); renderPantry(); closeSheet();
  }

  else if(act==='inc' || act==='dec'){
    const p = pantryById(id); if(!p) return;
    const st = stepOf(p);
    p.qty = Math.max(0, num(p.qty + (act==='inc'? st : -st)));
    p.full = Math.max(num(p.full)||0, p.qty);
    save(); renderPantry();
  }

  else if(act==='toList'){
    const p = pantryById(id); if(!p) return;
    if(p.inList){
      p.inList = false;
      state.list = state.list.filter(i=>i.pantryId!==p.id);
      toast(`${p.name} tolto dalla spesa`);
    } else {
      p.inList = true;
      state.list.push({id:uid(), name:p.name, qty:1, unit:p.unit||'', cat:p.cat, pantryId:p.id, done:false});
      toast(`${p.name} → lista della spesa`);
    }
    save(); renderPantry(); renderList();
  }

  else if(act==='tick'){
    const i = state.list.find(x=>x.id===id); if(!i) return;
    i.done = !i.done; save(); renderList();
  }

  else if(act==='rm-list'){
    const i = state.list.find(x=>x.id===id);
    if(i && i.pantryId){ const p=pantryById(i.pantryId); if(p) p.inList=false; }
    state.list = state.list.filter(x=>x.id!==id);
    save(); renderList(); renderPantry();
  }

  else if(act==='stock'){
    const done = state.list.filter(i=>i.done);
    done.forEach(i=>{
      const p = i.pantryId ? pantryById(i.pantryId) : state.pantry.find(x=>x.name.toLowerCase()===i.name.toLowerCase());
      if(p){ p.qty = num(p.qty + (i.qty||1)); p.full = Math.max(num(p.full)||0, p.qty); p.inList = false; }
      else state.pantry.push({id:uid(), name:i.name, cat:i.cat||'spuntini', loc:'Frigo', qty:i.qty||1, unit:i.unit||'porz', exp:'', inList:false});
    });
    state.list = state.list.filter(i=>!i.done);
    save(); renderList(); renderPantry(); toast(`${done.length} ${done.length===1?'alimento riposto':'alimenti riposti'} in dispensa`);
  }

  else if(act==='clear-done'){
    state.list.filter(i=>i.done && i.pantryId).forEach(i=>{ const p=pantryById(i.pantryId); if(p) p.inList=false; });
    state.list = state.list.filter(i=>!i.done);
    save(); renderList(); renderPantry();
  }
});

/* ============ navigazione e input ============ */
document.querySelector('nav').addEventListener('click', e=>{
  const b = e.target.closest('button[data-tab]'); if(!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
  ['pasti','dispensa','spesa'].forEach(t=>document.getElementById('tab-'+t).style.display = t===tab?'':'none');
  document.getElementById('fab').classList.toggle('on', tab==='dispensa');
  window.scrollTo(0,0);
  if(tab==='pasti' && view==='schede') scrollToToday(false);
});
document.getElementById('vSeg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-v]'); if(!b) return;
  view = b.dataset.v; save(); renderView(); window.scrollTo(0,0);
});
document.getElementById('wPrev').onclick = ()=>{ weekStart = addDays(weekStart,-7); renderView(); };
document.getElementById('wNext').onclick = ()=>{ weekStart = addDays(weekStart,7);  renderView(); };
document.getElementById('toToday').onclick = ()=>{ weekStart = mondayOf(new Date()); renderView(); if(view==='schede') scrollToToday(true); };
function clearWeek(){
  if(!confirm('Svuoto tutti i pasti di questa settimana? Le quantità tornano in dispensa.')) return;
  const w = week();
  for(let i=0;i<7;i++) MEALS.forEach(m=>{ w[i][m].forEach(e=>{ if(e.pantryId) restore(e.pantryId, e.qty); }); w[i][m]=[]; });
  save(); renderView(); renderPantry();
}
document.getElementById('clearWeek').onclick = clearWeek;
document.getElementById('pSearch').addEventListener('input', e=>{ pQuery = e.target.value; renderPantry(); });
document.getElementById('pSeg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-f]'); if(!b) return;
  pCat = b.dataset.f; renderPantry();
});
document.getElementById('openNewItem').onclick = ()=>sheetItem(null);
document.getElementById('fab').onclick = ()=>sheetItem(null);
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('scrim').onclick = closeSheet;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

function addToList(){
  const n = document.getElementById('sName'), q = document.getElementById('sQty');
  const name = n.value.trim(); if(!name){ n.focus(); return; }
  const match = state.pantry.find(p=>p.name.toLowerCase()===name.toLowerCase());
  state.list.push({id:uid(), name, qty:num(q.value)||1, unit: match?match.unit:'', cat: match?match.cat:'altro', pantryId: match?match.id:null, done:false});
  if(match) match.inList = true;
  n.value=''; q.value=''; n.focus();
  save(); renderList(); renderPantry();
}
document.getElementById('sAdd').onclick = addToList;
document.getElementById('sName').addEventListener('keydown', e=>{ if(e.key==='Enter') addToList(); });
document.getElementById('sQty').addEventListener('keydown', e=>{ if(e.key==='Enter') addToList(); });

/* ============ avvio ============ */
(async function init(){
  const raw = await store.get(KEY);
  if(raw){ try{ const p = JSON.parse(raw); state = {pantry:p.pantry||[], weeks:p.weeks||{}, list:p.list||[], view:p.view||'schede'};
      view = state.view; }catch(e){} }
  renderView(); renderPantry(); renderList();
})();
</script>
