<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EFE4">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dispensa">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23E8EFE4'/%3E%3Ctext x='90' y='125' font-size='100' text-anchor='middle'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<title>La Dispensa — pasti, frigo e spesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EFE4;
  --ink:#16301F;
  --ink-soft:#5C7360;
  --card:#FFFFFF;
  --line:#C9D8C2;
  --fragola:#DC4B6E;
  --albicocca:#D98A2B;
  --shadow:0 1px 0 rgba(22,48,31,.06), 0 8px 24px -16px rgba(22,48,31,.4);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--bg);
  padding:14px 16px 0;border-bottom:1px solid var(--line);
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.emojis{font-size:22px;letter-spacing:.14em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:clip}
.brand h1{font-size:26px;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:9px 14px;border-radius:10px 10px 0 0;font-size:14px;font-weight:500;
  color:var(--ink-soft);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--fragola);background:rgba(255,255,255,.6)}
nav button:focus-visible{outline:2px solid var(--fragola);outline-offset:-2px}

main{padding:18px 16px 90px;max-width:1180px;margin:0 auto}
.panel[hidden]{display:none}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:26px 0 10px}
.eyebrow:first-child{margin-top:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- riepilogo ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px}
.stat .n{font-family:Fraunces,serif;font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:6px}
.stat.warn .n{color:var(--albicocca)}
.stat.bad .n{color:var(--fragola)}
.today{padding:6px 14px 10px;margin-top:10px}
.today h2{font-size:19px;margin:10px 0 2px}
.today .date{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.trow{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);align-items:flex-start}
.trow .s{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);width:96px;flex:none;padding-top:3px}
.trow .v{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.trow .empty{color:var(--line);font-style:italic;font-size:13px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 14px;font-size:14px}
.alert b{font-weight:600}
.alert .when{font-size:12px;font-weight:600}
.alert.bad{border-color:var(--fragola)}
.alert.bad .when{color:var(--fragola)}
.alert.warn .when{color:var(--albicocca)}
.backup{margin-top:22px;overflow:hidden}
.backup summary{padding:13px 14px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.backup summary::-webkit-details-marker{display:none}
.backup summary::after{content:'+';font-size:18px;font-weight:400}
.backup[open] summary::after{content:'–'}
.backup summary:focus-visible{outline:2px solid var(--fragola);outline-offset:-2px}
.bk{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line)}
.bk p{margin:12px 0 0;font-size:13px;color:var(--ink-soft)}
.bkmeta{font-size:11px;color:var(--ink-soft)}

/* ---------- settimana ---------- */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;margin-bottom:14px}
.weekbar .lab{font-family:Fraunces,serif;font-size:17px;font-weight:600;text-align:center;flex:1}
.weekbar .lab small{display:block;font-family:Inter,sans-serif;font-size:11px;color:var(--ink-soft);font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.arrow{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--ink-soft)}
.arrow:hover{background:var(--bg)}
.days{display:grid;gap:12px;grid-template-columns:1fr}
.day{padding:12px 14px 14px}
.day.is-today{border-color:var(--ink)}
.day h3{font-size:18px;display:flex;align-items:baseline;gap:8px}
.day h3 span{font-family:Inter,sans-serif;font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px}
.act{width:auto;flex:none;max-width:56%;padding:6px 10px;font-size:12px;border-radius:10px;background:#fff;color:var(--ink-soft);border-color:var(--line)}
.act:not([value=""]){color:var(--ink)}
.slot{display:flex;gap:10px;padding:8px 6px;border-top:1px dashed var(--line);align-items:flex-start;cursor:pointer;border-radius:8px;margin:0 -6px}
.slot:hover{background:rgba(232,239,228,.6)}
.slot:focus-visible{outline:2px solid var(--fragola);outline-offset:-2px}
.ph{font-size:13px;color:var(--line);font-style:italic;padding-top:4px}
.slot:first-of-type{margin-top:6px}
.slot .name{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);width:96px;flex:none;padding-top:5px}
.slot .items{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:30px}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;max-width:100%;
}
.chip.free{background:#fff;border-style:dashed}
.chip b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .p{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft);font-weight:700}
.chip .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--ink-soft);line-height:1}
.chip .x:hover{background:var(--fragola);color:#fff}
.add{width:28px;height:28px;border-radius:50%;border:1px dashed var(--line);color:var(--ink-soft);display:grid;place-items:center;font-size:17px;line-height:1;padding-bottom:2px}
.add:hover{border-style:solid;border-color:var(--ink);color:var(--ink)}

/* ---------- frigo ---------- */
.catbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catbar button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:#fff;white-space:nowrap;color:var(--ink-soft)}
.catbar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:500}
.items{display:grid;gap:10px;grid-template-columns:1fr}
.item{overflow:hidden}
.item summary{padding:10px 12px;cursor:pointer;list-style:none}
.item summary::-webkit-details-marker{display:none}
.item summary:focus-visible{outline:2px solid var(--fragola);outline-offset:-2px}
.item[open] summary{background:rgba(232,239,228,.5)}
.item .nm{font-family:Fraunces,serif;font-size:16px;font-weight:600;line-height:1.2}
.item .ice{font-size:13px}
.item .open-ico{font-size:12px}
.item .meta{font-size:11px;color:var(--ink-soft);margin-top:2px}
.item .meta .exp{font-weight:600}
.exp.warn{color:var(--albicocca)}
.exp.bad{color:var(--fragola)}
/* signature: tacche porzioni */
.ticks{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;align-items:center;justify-content:flex-end}
.tick{width:11px;height:17px;border-radius:2px;background:var(--ink);border:1px solid var(--ink)}
.tick.used{background:transparent;border-style:dashed;border-color:var(--line)}
.ticks .cnt{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;margin-right:auto}
.ticks .cnt small{font-weight:500;color:var(--ink-soft)}
.ticks.out .cnt{color:var(--fragola)}
.iact{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;border-top:1px dashed var(--line)}
.mini{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-soft)}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.mini.danger:hover{border-color:var(--fragola);color:var(--fragola)}

/* ---------- spesa ---------- */
.shop{overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:none}
.box{width:22px;height:22px;flex:none;border:1.5px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-size:14px;color:transparent}
.srow.done .box{background:var(--ink);color:#fff}
.srow.done .txt{text-decoration:line-through;color:var(--ink-soft)}
.srow .txt{flex:1;font-size:15px}
.srow .qta{font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--bg);border-radius:6px;padding:1px 6px;margin-left:2px}
.srow .cat{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line);padding:2px 7px;border-radius:999px}
.srow .del{color:var(--line);font-size:18px;padding:0 4px;line-height:1}
.srow .del:hover{color:var(--fragola)}
.srow .ed:hover{color:var(--ink)}
.srow.editing{display:block;background:rgba(232,239,228,.5)}
.erow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.erow:last-child{margin-bottom:0}
.ei{font-size:15px;padding:8px 10px;border-radius:9px}
.ei.sm{max-width:38%}
.srow.editing .mini{flex:none;padding:9px 14px;border-color:var(--ink);color:var(--ink);font-weight:600}
.shopfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft)}

/* ---------- form / inputs ---------- */
.row{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;flex:1;min-width:0}
input,select{
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  font-size:16px;font-weight:400;width:100%;letter-spacing:0;text-transform:none;color:var(--ink);
}
input:focus,select:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.btn{background:var(--ink);color:#fff;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600}
.btn:hover{background:#0d2115}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px}
.toggle .dot{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .dot::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed="true"]{border-color:var(--ink)}
.toggle[aria-pressed="true"] .dot{background:var(--ink)}
.toggle[aria-pressed="true"] .dot::after{transform:translateX(17px)}
.form{padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,48,31,.4);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.scrim[hidden]{display:none}
.sheet{
  background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:20px}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:2px}
.sheet .shsub{font-size:12px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.pick{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.pick button{
  display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;
}
.pick button:hover{border-color:var(--ink)}
.pick button:disabled{opacity:.45;cursor:not-allowed}
.bufempty{font-size:12px;color:var(--ink-soft);font-style:italic;padding:2px 2px 4px}
.bufrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--ink);border-radius:11px;padding:8px 10px;margin-bottom:6px}
.bn{display:flex;flex-direction:column;font-size:14px;font-weight:500;min-width:0}
.bn small{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;color:var(--ink-soft)}
.bctl{display:flex;align-items:center;gap:8px;flex:none}
.bctl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);font-size:16px;line-height:1;color:var(--ink)}
.bctl button:disabled{opacity:.35}
.pick .left{display:flex;flex-direction:column;gap:2px;min-width:0}
.pick .left small{font-size:11px;color:var(--ink-soft)}
.pick .rem{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;flex:none}
.empty-note{font-size:13px;color:var(--ink-soft);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
@media(min-width:720px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .days{grid-template-columns:repeat(2,1fr)}
  .items{grid-template-columns:repeat(2,1fr)}
  .scrim{align-items:center}
  .sheet{border-radius:20px}
}
@media(min-width:1040px){.days{grid-template-columns:repeat(3,1fr)}.items{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand" aria-label="La Dispensa">
    <span class="emojis">🥗 🍅 🥑 🍕 🍞 🍔 🧀 🍣 🍓 🥦 🍋</span>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="riepilogo" aria-selected="true">Riepilogo</button>
    <button role="tab" data-tab="settimana" aria-selected="false">Settimana</button>
    <button role="tab" data-tab="frigo" aria-selected="false">Frigo</button>
    <button role="tab" data-tab="spesa" aria-selected="false">Spesa</button>
  </nav>
</header>

<main>
  <section class="panel" id="p-riepilogo"></section>
  <section class="panel" id="p-settimana" hidden></section>
  <section class="panel" id="p-frigo" hidden></section>
  <section class="panel" id="p-spesa" hidden></section>
</main>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet"></div></div>

<script>
/* ============ dati ============ */
const CATS=[
  {id:'proteine',label:'Proteine'},
  {id:'carbo',label:'Carbo'},
  {id:'colazione',label:'Colazione'},
  {id:'ortofrutta',label:'Frutta & verdura'}
];
const SLOTS=['Colazione','Merenda mattina','Pranzo','Merenda pomeriggio','Spuntino','Cena'];
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const ACTS=[{v:'palestra',l:'🏋️ Palestra'},{v:'corsa',l:'🏃‍♀️ Correre'},{v:'acquagym',l:'🏊‍♀️ Acquagym'},{v:'camminata',l:'🚶‍♀️ Camminata'},{v:'rest',l:'😴 Rest'}];
const KEY='dispensa:v1';

let state={fridge:[],meals:{},shopping:[],activities:{}};
let tab='riepilogo', cat='tutti', weekOffset=0, saveTimer=null;

/* ============ util ============ */
const uid=()=>Math.random().toString(36).slice(2,9);
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function monday(off=0){
  const d=new Date();d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);
  return d;
}
const iso=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const weekKey=()=>iso(monday(weekOffset));
function dayDate(i){const d=monday(weekOffset);d.setDate(d.getDate()+i);return d;}
const fmtShort=(d)=>d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
function daysTo(dateStr){
  if(!dateStr)return null;
  const t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(dateStr+'T00:00:00')-t)/864e5);
}
function expLabel(dateStr){
  const n=daysTo(dateStr);
  if(n===null)return{txt:'',cls:''};
  if(n<0)return{txt:'scaduto',cls:'bad'};
  if(n===0)return{txt:'scade oggi',cls:'bad'};
  if(n===1)return{txt:'scade domani',cls:'warn'};
  if(n<=3)return{txt:'scade tra '+n+' giorni',cls:'warn'};
  return{txt:'scade il '+fmtShort(new Date(dateStr+'T00:00:00')),cls:''};
}
const unitOf=(it)=>it.unita||'pz';
const isWeight=(it)=>unitOf(it)!=='pz';
function totPort(it){
  const q=+it.quantita||0, p=+it.porzioni||0;
  if(p<=0||q<=0)return 0;
  return isWeight(it)?Math.floor(q/p):Math.round(q*p);
}
const remPort=(it)=>Math.max(0,totPort(it)-(+it.usate||0));
const mealsOf=(k)=>state.meals[k]||(state.meals[k]=[]);
const actsOf=(k)=>state.activities[k]||(state.activities[k]={});

/* ============ storage ============ */
async function load(){
  try{
    const r={value:localStorage.getItem(KEY)};
    if(r&&r.value){const d=JSON.parse(r.value);state={fridge:d.fridge||[],meals:d.meals||{},shopping:(d.shopping||[]).map(x=>{const{edit,...r}=x;return r;}),activities:d.activities||{}};}
  }catch(e){/* prima apertura o storage non disponibile */}
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{localStorage.setItem(KEY,JSON.stringify(state));}
    catch(e){console.warn('Salvataggio non riuscito',e);}
  },250);
}

/* ============ render ============ */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+tab);
  ({riepilogo:renderRiepilogo,settimana:renderSettimana,frigo:renderFrigo,spesa:renderSpesa})[tab]();
}

/* ---- riepilogo ---- */
function renderRiepilogo(){
  const k=weekKey(), m=mealsOf(k);
  const scad=state.fridge.filter(i=>{const n=daysTo(i.scadenza);return n!==null&&n<=3&&remPort(i)>0;})
                         .sort((a,b)=>daysTo(a.scadenza)-daysTo(b.scadenza));

  const todayIdx=(new Date().getDay()+6)%7;
  const isThisWeek=weekOffset===0;
  const today=new Date();

  const rows=SLOTS.map((s,si)=>{
    const list=isThisWeek?m.filter(e=>e.d===todayIdx&&e.s===si):[];
    return `<div class="trow"><div class="s">${s}</div><div class="v">${
      list.length?list.map(e=>`<span class="chip"><b>${esc(e.nome)}</b>${e.porzioni>1?`<span class="p">${e.porzioni}×</span>`:''}</span>`).join('')
      :'<span class="empty">niente in programma</span>'}</div></div>`;
  }).join('');

  document.getElementById('p-riepilogo').innerHTML=`
    <div class="eyebrow">Oggi</div>
    <div class="card today">
      <h2>${DAYS[todayIdx]}</h2>
      <div class="date">${today.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}${
        isThisWeek&&actsOf(k)[todayIdx]?' · '+ACTS.find(a=>a.v===actsOf(k)[todayIdx]).l:''}</div>
      ${isThisWeek?rows:'<div class="empty-note" style="margin:8px 0 12px">Stai guardando un\'altra settimana nel tab Settimana.</div>'}
    </div>

    <div class="eyebrow">Da usare presto</div>
    ${scad.length?`<div class="alerts">${scad.map(i=>{
        const e=expLabel(i.scadenza);
        return `<div class="card alert ${e.cls}"><span><b>${esc(i.nome)}</b> · <span class="mono">${remPort(i)}</span> porzioni rimaste</span><span class="when">${e.txt}</span></div>`;
      }).join('')}</div>`
    :'<div class="empty-note">Niente in scadenza. Frigo tranquillo.</div>'}

    <details class="card backup">
      <summary>Backup dei dati</summary>
      <div class="bk">
        <p>Scarica una copia di frigo, pasti e spesa prima di aggiornare la pagina. Il file si riapre con Importa.</p>
        <div class="row">
          <button class="btn ghost" id="expBtn" style="flex:1">Esporta backup</button>
          <button class="btn ghost" id="impBtn" style="flex:1">Importa backup</button>
        </div>
        <input type="file" id="impFile" accept="application/json,.json" hidden>
        <div class="bkmeta mono">${state.fridge.length} alimenti · ${Object.values(state.meals).reduce((a,x)=>a+x.length,0)} voci nei pasti · ${state.shopping.length} in lista</div>
      </div>
    </details>`;
}

/* ---- settimana ---- */
function renderSettimana(){
  const k=weekKey(), m=mealsOf(k), acts=actsOf(k);
  const start=monday(weekOffset), end=dayDate(6);
  const todayIdx=weekOffset===0?(new Date().getDay()+6)%7:-1;

  const days=DAYS.map((dn,di)=>{
    const slots=SLOTS.map((sn,si)=>{
      const list=m.filter(e=>e.d===di&&e.s===si);
      return `<div class="slot" data-add="${di}-${si}" role="button" tabindex="0" aria-label="Aggiungi a ${sn} di ${dn}"><div class="name">${sn}</div><div class="items">${
        list.map(e=>{
          const ings=e.ing?.length?e.ing:(e.ref?[{ref:e.ref,porzioni:e.porzioni}]:[]);
          const det=ings.map(x=>(state.fridge.find(f=>f.id===x.ref)?.nome||'?')+' ×'+x.porzioni).join(', ');
          return `<span class="chip ${ings.length?'':'free'}" ${det?`title="${esc(det)}"`:''}><b>${esc(e.nome)}</b>${ings.length?`<span class="p">${ings.length>1?'🧺':''}${e.porzioni}×</span>`:''}<button class="x" data-del="${e.id}" aria-label="Togli ${esc(e.nome)}">×</button></span>`;
        }).join('')
      }${list.length?'':'<span class="ph">tocca per aggiungere</span>'}</div></div>`;
    }).join('');
    return `<div class="card day ${di===todayIdx?'is-today':''}">
      <div class="dayhead">
        <h3>${dn} <span>${fmtShort(dayDate(di))}</span></h3>
        <select class="act" data-act="${di}" aria-label="Attività di ${dn}">
          <option value="">+ attività</option>
          ${ACTS.map(a=>`<option value="${a.v}" ${acts[di]===a.v?'selected':''}>${a.l}</option>`).join('')}
        </select>
      </div>${slots}</div>`;
  }).join('');

  document.getElementById('p-settimana').innerHTML=`
    <div class="card weekbar">
      <button class="arrow" data-week="-1" aria-label="Settimana precedente">‹</button>
      <div class="lab">${fmtShort(start)} – ${fmtShort(end)}<small>${weekOffset===0?'questa settimana':(weekOffset<0?Math.abs(weekOffset)+' sett. fa':'tra '+weekOffset+' sett.')}</small></div>
      <button class="arrow" data-week="1" aria-label="Settimana successiva">›</button>
    </div>
    <div class="days">${days}</div>`;
}

/* ---- frigo ---- */
function renderFrigo(){
  const list=state.fridge.filter(i=>cat==='tutti'||i.cat===cat)
    .sort((a,b)=>(a.freezer?1:0)-(b.freezer?1:0));

  const cards=list.map(i=>{
    const tot=totPort(i), rem=remPort(i), e=expLabel(i.scadenza);
    const u=unitOf(i);
    const qtxt=isWeight(i)?`${i.quantita} ${u} · ${i.porzioni} ${u}/porz.`:`${i.quantita} pz × ${i.porzioni} porz.`;
    const rtxt=isWeight(i)&&rem?` · ${+(rem*i.porzioni).toFixed(2)} ${u}`:'';
    const ticks=tot<=14
      ? Array.from({length:tot},(_,n)=>`<span class="tick ${n<rem?'':'used'}"></span>`).join('')
      : '';
    return `<details class="card item">
      <summary>
        <div class="nm">${i.freezer?'<span class="ice" title="In freezer">❄️</span> ':''}${esc(i.nome)}${(+i.usate>0&&rem>0)?' <span class="open-ico" title="Già aperto: consuma le porzioni rimaste">‼️</span>':''}</div>
        <div class="meta">${CATS.find(c=>c.id===i.cat)?.label||''} · ${qtxt}${e.txt?` · <span class="exp ${e.cls}">${e.txt}</span>`:''}</div>
        <div class="ticks ${rem?'':'out'}"><span class="cnt">${rem}<small>/${tot} porzioni${rtxt}</small></span>${ticks}</div>
      </summary>
      <div class="iact">
        <button class="mini" data-mv="${i.id}|-1" aria-label="Sposta su">↑</button>
        <button class="mini" data-mv="${i.id}|1" aria-label="Sposta giù">↓</button>
        <button class="mini" data-edit="${i.id}">Modifica</button>
        <button class="mini" data-reset="${i.id}">Azzera consumo</button>
        <button class="mini" data-toshop="${i.id}">Metti in spesa</button>
        <button class="mini danger" data-rm="${i.id}">Elimina</button>
      </div>
    </details>`;
  }).join('');

  document.getElementById('p-frigo').innerHTML=`
    <div class="catbar">
      <button data-cat="tutti" aria-pressed="${cat==='tutti'}">Tutto</button>
      ${CATS.map(c=>`<button data-cat="${c.id}" aria-pressed="${cat===c.id}">${c.label}</button>`).join('')}
    </div>
    <button class="btn wide" id="newItem" style="margin-bottom:14px">+ Aggiungi alimento</button>
    ${list.length?`<div class="items">${cards}</div>`:'<div class="empty-note">Nessun alimento in questa categoria. Aggiungine uno per iniziare a pianificare.</div>'}`;
}

/* ============ sheet ============ */
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('scrim').hidden=false;}
function closeSheet(){document.getElementById('scrim').hidden=true;}

function sheetPasto(di,si){
  const buf=new Map(); // id alimento -> porzioni scelte

  const groupsHtml=()=>{
    const groups=CATS.map(c=>({
      label:c.label,
      items:state.fridge.filter(i=>i.cat===c.id&&remPort(i)>0).sort((a,b)=>(a.freezer?1:0)-(b.freezer?1:0))
    })).filter(g=>g.items.length);
    if(!groups.length)return '<div class="empty-note">Il frigo è vuoto o le porzioni sono finite.</div>';
    return groups.map(g=>`<div class="eyebrow" style="margin:14px 0 8px">${g.label}</div>
      <div class="pick">${g.items.map(i=>{
        const e=expLabel(i.scadenza), left=remPort(i)-(buf.get(i.id)||0);
        return `<button data-pick="${i.id}" ${left<1?'disabled':''}><span class="left"><b>${i.freezer?'❄️ ':''}${esc(i.nome)}</b><small>${e.txt||'senza scadenza'}</small></span><span class="rem">${left} porz.</span></button>`;
      }).join('')}</div>`).join('');
  };

  const drawBuf=()=>{
    const box=document.getElementById('bufBox');
    if(!buf.size){box.innerHTML='<div class="bufempty">Nessun ingrediente selezionato: il pasto non scalerà il frigo.</div>';return;}
    box.innerHTML=[...buf].map(([id,n])=>{
      const it=state.fridge.find(x=>x.id===id); if(!it)return '';
      const q=isWeight(it)?` · ${+(n*it.porzioni).toFixed(2)} ${unitOf(it)}`:'';
      return `<div class="bufrow"><span class="bn">${esc(it.nome)}<small>${n} porz.${q}</small></span>
        <span class="bctl"><button data-b="${id}|-1" aria-label="Meno">−</button><span class="mono">${n}</span><button data-b="${id}|1" aria-label="Più" ${remPort(it)-n<1?'disabled':''}>+</button></span></div>`;
    }).join('');
  };

  const refresh=()=>{
    document.getElementById('pickBox').innerHTML=groupsHtml();
    bindPicks(); drawBuf();
  };

  const bindPicks=()=>{
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.pick, it=state.fridge.find(x=>x.id===id);
      if(!it||remPort(it)-(buf.get(id)||0)<1)return;
      buf.set(id,(buf.get(id)||0)+1);
      refresh();
    });
  };

  openSheet(`
    <div class="sh"><h2>${SLOTS[si]}</h2><button class="mini" id="close">Chiudi</button></div>
    <div class="shsub">${DAYS[di]} ${fmtShort(dayDate(di))}</div>
    <div class="card form" style="margin-bottom:0">
      <label class="f">Nome del pasto<input id="freeName" placeholder="es. pancake — lascia vuoto per usare gli ingredienti"></label>
    </div>
    <div class="eyebrow">Ingredienti dal frigo</div>
    <div id="bufBox"></div>
    <div id="pickBox"></div>
    <button class="btn wide" id="addBtn" style="margin-top:14px">Aggiungi al pasto</button>`);

  document.getElementById('pickBox').innerHTML=groupsHtml();
  bindPicks(); drawBuf();
  document.getElementById('close').onclick=closeSheet;

  document.getElementById('bufBox').addEventListener('click',ev=>{
    const b=ev.target.closest('[data-b]'); if(!b)return;
    const [id,dir]=b.dataset.b.split('|'); const it=state.fridge.find(x=>x.id===id);
    let n=(buf.get(id)||0)+ +dir;
    if(n<=0)buf.delete(id);
    else if(it&&n<=remPort(it))buf.set(id,n);
    refresh();
  });

  const conferma=()=>{
    const nomeLibero=document.getElementById('freeName').value.trim();
    const ing=[...buf].map(([ref,porzioni])=>({ref,porzioni}));
    const nome=nomeLibero||ing.map(x=>state.fridge.find(f=>f.id===x.ref)?.nome).filter(Boolean).join(' + ');
    if(!nome)return;
    ing.forEach(x=>{const it=state.fridge.find(f=>f.id===x.ref);if(it)it.usate=(+it.usate||0)+x.porzioni;});
    mealsOf(weekKey()).push({id:uid(),d:di,s:si,nome,
      porzioni:ing.reduce((a,x)=>a+x.porzioni,0)||1, ing, ref:null});
    save();closeSheet();render();
  };
  document.getElementById('addBtn').onclick=conferma;
  document.getElementById('freeName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();conferma();}};
}

function sheetItem(id){
  const it=id?state.fridge.find(x=>x.id===id):null;
  openSheet(`
    <div class="sh"><h2>${it?'Modifica alimento':'Nuovo alimento'}</h2><button class="mini" id="close">Chiudi</button></div>
    <div class="shsub">${it?'usate '+(it.usate||0)+' porzioni':'aggiungi al frigo'}</div>
    <div class="card form" style="margin-bottom:0">
      <label class="f">Alimento<input id="fNome" value="${esc(it?.nome||'')}" placeholder="es. petto di pollo"></label>
      <label class="f">Categoria<select id="fCat">${CATS.map(c=>`<option value="${c.id}" ${it?.cat===c.id?'selected':''}>${c.label}</option>`).join('')}</select></label>
      <div class="row">
        <label class="f" style="flex:2">Quantità<input id="fQta" type="number" min="0" step="any" value="${it?.quantita??1}"></label>
        <label class="f" style="flex:1">Unità<select id="fUnita">
          ${['pz','g','kg','ml','l'].map(u=>`<option value="${u}" ${(it?.unita||'pz')===u?'selected':''}>${u}</option>`).join('')}
        </select></label>
      </div>
      <label class="f"><span id="porzTxt"></span><input id="fPorz" type="number" min="0" step="any" value="${it?.porzioni??2}"></label>
      <label class="f">Scadenza<input id="fScad" type="date" value="${it?.scadenza||''}"></label>
      <button class="toggle" id="fFreezer" aria-pressed="${!!it?.freezer}"><span>❄️ In freezer</span><span class="dot"></span></button>
      <button class="btn wide" id="fSave">${it?'Salva modifiche':'Aggiungi al frigo'}</button>
    </div>`);
  document.getElementById('close').onclick=closeSheet;
  const un=document.getElementById('fUnita'), pz=document.getElementById('fPorz');
  const updLbl=()=>{
    const u=un.value;
    document.getElementById('porzTxt').textContent=u==='pz'?'Porzioni per pezzo':`Quanti ${u} per porzione`;
  };
  un.onchange=updLbl; updLbl();
  const fz=document.getElementById('fFreezer');
  fz.onclick=()=>fz.setAttribute('aria-pressed',fz.getAttribute('aria-pressed')!=='true');
  document.getElementById('fSave').onclick=()=>{
    const nome=document.getElementById('fNome').value.trim();
    if(!nome){document.getElementById('fNome').focus();return;}
    const d={nome,cat:document.getElementById('fCat').value,
      unita:un.value,
      porzioni:Math.max(0,+pz.value||1),
      quantita:Math.max(0,+document.getElementById('fQta').value||0),
      scadenza:document.getElementById('fScad').value,
      freezer:fz.getAttribute('aria-pressed')==='true'};
    if(it)Object.assign(it,d);
    else state.fridge.push({id:uid(),usate:0,...d});
    save();closeSheet();render();
  };
}

/* ============ eventi ============ */
document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render();
});
document.getElementById('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

document.querySelector('main').addEventListener('click',e=>{
  const t=e.target;
  const add=t.closest('[data-add]'), del=t.closest('[data-del]'), wk=t.closest('[data-week]'),
        c=t.closest('[data-cat]'), ed=t.closest('[data-edit]'), rm=t.closest('[data-rm]'),
        rs=t.closest('[data-reset]'), ts=t.closest('[data-toshop]'), mv=t.closest('[data-mv]'),
        tg=t.closest('[data-toggle]'), sd=t.closest('[data-shdel]');

  if(mv){
    const[id,dir]=mv.dataset.mv.split('|'); const step=+dir;
    const i=state.fridge.findIndex(x=>x.id===id);
    if(i>-1){
      const me=state.fridge[i];
      let j=i+step;
      while(j>=0&&j<state.fridge.length){
        const o=state.fridge[j];
        if(!!o.freezer===!!me.freezer&&(cat==='tutti'||o.cat===cat))break;
        j+=step;
      }
      if(j>=0&&j<state.fridge.length){
        state.fridge[i]=state.fridge[j];state.fridge[j]=me;save();render();
        const b2=document.querySelector('[data-mv="'+id+'|'+dir+'"]');
        if(b2){b2.closest('details').open=true;b2.closest('details').scrollIntoView({block:'center'});}
      }
    }
  }
  else if(del){
    const m=mealsOf(weekKey()), i=m.findIndex(x=>x.id===del.dataset.del);
    if(i>-1){const e2=m[i];
      const ings=e2.ing?.length?e2.ing:(e2.ref?[{ref:e2.ref,porzioni:e2.porzioni}]:[]);
      ings.forEach(x=>{const it=state.fridge.find(f=>f.id===x.ref);if(it)it.usate=Math.max(0,(+it.usate||0)-x.porzioni);});
      m.splice(i,1);save();render();}
  }
  else if(add){const[d,s]=add.dataset.add.split('-').map(Number);sheetPasto(d,s);}
  else if(wk){weekOffset+=+wk.dataset.week;render();}
  else if(c){cat=c.dataset.cat;render();}
  else if(t.id==='newItem'){sheetItem(null);}
  else if(ed){sheetItem(ed.dataset.edit);}
  else if(rs){const it=state.fridge.find(x=>x.id===rs.dataset.reset);if(it){it.usate=0;save();render();}}
  else if(ts){
    const it=state.fridge.find(x=>x.id===ts.dataset.toshop);
    if(it&&!state.shopping.some(s=>s.nome.toLowerCase()===it.nome.toLowerCase()&&!s.done)){
      const q=isWeight(it)?`${it.quantita} ${unitOf(it)}`:`${it.quantita} pz`;
      state.shopping.push({id:uid(),nome:it.nome,qta:q,cat:it.cat,done:false});save();
    }
    tab='spesa';render();
  }
  else if(rm){
    const it=state.fridge.find(x=>x.id===rm.dataset.rm);
    if(it&&confirm('Elimino "'+it.nome+'" dal frigo? I pasti già pianificati restano.')){
      state.fridge=state.fridge.filter(x=>x.id!==rm.dataset.rm);
      Object.values(state.meals).forEach(m=>m.forEach(e2=>{if(e2.ref===rm.dataset.rm)e2.ref=null;}));
      save();render();
    }
  }
  else if(t.closest('[data-shedit]')){
    const id=t.closest('[data-shedit]').dataset.shedit;
    state.shopping.forEach(s=>s.edit=(s.id===id));
    render();
    const f=document.querySelector('[data-ef^="nome|"]'); if(f)f.focus();
  }
  else if(t.closest('[data-shsave]')){
    const id=t.closest('[data-shsave]').dataset.shsave;
    const s=state.shopping.find(x=>x.id===id);
    if(s){
      const g=(f)=>document.querySelector('[data-ef="'+f+'|'+id+'"]')?.value.trim()??'';
      const n=g('nome'); if(n)s.nome=n;
      s.qta=g('qta'); s.cat=g('cat'); delete s.edit;
      save();
    }
    render();
  }
  else if(sd){state.shopping=state.shopping.filter(s=>s.id!==sd.dataset.shdel);save();render();}
  else if(tg){const s=state.shopping.find(x=>x.id===tg.dataset.toggle);if(s){s.done=!s.done;save();render();}}
  else if(t.id==='clearDone'){state.shopping=state.shopping.filter(s=>!s.done);save();render();}
  else if(t.id==='expBtn'){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='dispensa-'+iso(new Date())+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  else if(t.id==='impBtn'){document.getElementById('impFile').click();}
  else if(t.id==='shAdd'){
    const n=document.getElementById('shName'), q=document.getElementById('shQta');
    if(n.value.trim()){
      state.shopping.push({id:uid(),nome:n.value.trim(),qta:q.value.trim(),cat:document.getElementById('shCat').value,done:false});
      save();render();
    }
  }
});
document.querySelector('main').addEventListener('change',e=>{
  if(e.target.matches('[data-act]')){
    const a=actsOf(weekKey());
    const d=e.target.dataset.act;
    if(e.target.value)a[d]=e.target.value;else delete a[d];
    save();render();
    return;
  }
  if(e.target.id!=='impFile')return;
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.fridge))throw 0;
      if(!confirm('Sostituisco i dati attuali con quelli del backup? I dati di adesso vengono persi.'))return;
      state={fridge:d.fridge||[],meals:d.meals||{},shopping:(d.shopping||[]).map(x=>{const{edit,...r}=x;return r;}),activities:d.activities||{}};
      save();render();
    }catch(err){alert('Il file non è un backup della Dispensa. Scegline un altro.');}
  };
  r.onerror=()=>alert('Non sono riuscita a leggere il file. Riprova.');
  r.readAsText(f);
  e.target.value='';
});
document.querySelector('main').addEventListener('keydown',e=>{
  const sl=e.target.closest?.('.slot[data-add]');
  if(sl&&(e.key==='Enter'||e.key===' ')){
    e.preventDefault();
    const[d,s]=sl.dataset.add.split('-').map(Number);sheetPasto(d,s);return;
  }
  if(e.key==='Enter'&&e.target.matches?.('[data-ef]')){
    e.preventDefault();
    const id=e.target.dataset.ef.split('|')[1];
    document.querySelector('[data-shsave="'+id+'"]')?.click();
    return;
  }
  if(e.key==='Enter'&&(e.target.id==='shName'||e.target.id==='shQta')){e.preventDefault();document.getElementById('shAdd').click();}
});

/* ============ avvio ============ */
(async()=>{await load();render();})();
</script>
</body>
</html>
